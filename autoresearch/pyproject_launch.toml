[project]
name = "autoresearch"
version = "0.1.0"
description = "Catalyst autoresearch environment"
requires-python = ">=3.10"
dependencies = [
    "kernels==0.12.3",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken==0.12.0",
    "torch==2.11.0",
]

[tool.uv]
exclude-newer = "2 week"
torch-backend = "auto"
